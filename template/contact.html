{% extends 'main.html' %}
{% block content %}
{% if messages %}
{% for message in messages %}
  <div class="alert mt-5  {{ message.tags }}" role="alert">
    <strong>
      {% if request.session.customer  %}
      {{request.session.customer}} {% else %}User !{% endif %}</strong> {{ message }}
</div>
{% endfor %}
{% endif %}
<form method="post" class="my-5">
    <h1 class="my-5 text-center">Contact <span>Us</span></h1>
    {% csrf_token %} 
    <div class="row">
        <div class="col-lg-12">
            <input type="email" name="email" class=" my-5 form-control formbox" placeholder="Enter Your Email" >
        </div>
        <div class="col-lg-12">
            <textarea placeholder="enter the message" name="msg" id="id"  class="box" cols="1" rows="30">

            </textarea>
        </div>
    </div>
    <input type="submit" class="mt-4 aa text-white">
</form>
{% endblock content %}
